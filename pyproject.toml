[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsopt"
version = "0.1.0"
description = "Quantum Sensing Optimization Library using JAX and QuTiP"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Simone Bordoni", email = "simone.bordoni@uniroma1.it"},
    {name = "Nathan Campioni", email = "nathan.campioni@gmail.com"}
]
keywords = ["quantum", "sensing", "optimization", "quantum optics", "jax", "qutip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy==2.3.5",
    "jax==0.9.2",
    "jaxlib==0.9.2",
    "qutip==5.2.2",
    "qutip-jax==0.1.1",
    "qutip-qip==0.3.1",
    "optax==0.2.4",
    "matplotlib==3.10.0",
    "scipy==1.16.3",
    "ml-dtypes==0.5.3",
    "opt-einsum==3.4.0",
    "chex==0.1.89",
    "pandas==2.2.3",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
# GPU acceleration extras (mutually exclusive with each other)
cuda12 = [
    "jax[cuda12]==0.9.2",
]

cuda11 = [
    "jax[cuda11]==0.9.2",
]

# Development and testing extras (mix and match as needed)
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "coverage==7.12.0",
    "jaxtyping==0.3.9",
    "black==25.1.0",
    "isort==7.0.0",
    "pylint==4.0.5",
    "mypy-extensions==1.1.0",
    "autopep8==2.0.4",
    "pycodestyle==2.14.0",
]

test = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "coverage==7.12.0",
    "jaxtyping==0.3.9",
]

jupyter = [
    "ipykernel==6.29.5",
    "ipython==9.4.0",
    "jupyter-client==8.6.3",
    "jupyter-core==5.8.1",
]

[project.urls]
Homepage = "https://github.com/Simone-Bordoni/Quantum-sensing-QML"
Repository = "https://github.com/Simone-Bordoni/Quantum-sensing-QML"
Documentation = "https://github.com/Simone-Bordoni/Quantum-sensing-QML/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "src/qsopt/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["src/qsopt"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
