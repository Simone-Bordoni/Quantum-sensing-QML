name: Tests and Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-format-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install linting tools
      run: |
        pip install black isort pylint
    
    - name: Check code formatting with black
      run: |
        black --check src/ --line-length 100
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black src/
      continue-on-error: true

  test-multi-platform:
    needs: lint-and-format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.13']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display system information
      run: |
        python --version
        pip --version
    
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    
    - name: Install package with test dependencies
      run: |
        pip install -e ".[test]"
    
    - name: Verify core dependencies
      run: |
        python -c "import qsopt; print(f'qsopt: {qsopt.__version__}')"
        python -c "import jax; print(f'JAX: {jax.__version__}')"
        python -c "import qutip; print(f'QuTiP: {qutip.__version__}')"
        python -c "import numpy; print(f'NumPy: {numpy.__version__}')"
        python -c "import optax; print(f'Optax: {optax.__version__}')"
    
    - name: Run installation tests
      run: |
        pytest src/qsopt/tests/test_installation.py -v --tb=short
    
    - name: Run gate and circuit tests
      run: |
        pytest src/qsopt/tests/test_gates.py src/qsopt/tests/test_circuit.py -v --tb=short
    
    - name: Run remaining tests
      run: |
        pytest src/qsopt/tests/ -v --ignore=src/qsopt/tests/test_installation.py --ignore=src/qsopt/tests/test_gates.py --ignore=src/qsopt/tests/test_circuit.py --tb=short -x
      continue-on-error: true

  test-coverage:
    needs: test-multi-platform
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install package with coverage tools
      run: |
        pip install --upgrade pip
        pip install -e ".[test]"
        pip install pytest-cov coverage
    
    - name: Run tests with coverage
      run: |
        pytest src/qsopt/tests/test_installation.py src/qsopt/tests/test_gates.py src/qsopt/tests/test_circuit.py --cov=src/qsopt --cov-report=term --cov-report=xml --cov-report=html
      continue-on-error: true
    
    - name: Display coverage report
      if: always()
      run: |
        coverage report
      continue-on-error: true
    
    - name: Upload coverage to artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14
      continue-on-error: true
