name: Tests and Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: lint-${{ hashFiles('requirements-dev.txt') }}

    - name: Install linting tools
      run: pip install pylint==$(grep 'pylint==' requirements-dev.txt | cut -d= -f3)

    - name: Run pylint on source (errors only, using .pylintrc)
      run: |
        python -m pylint src/qsopt/core src/qsopt/utils src/qsopt/__init__.py \
          --disable=C,R,W \
          --score=no

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/AppData/Local/pip/Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install package and test dependencies
      run: pip install -e ".[test]"

    - name: Verify core dependencies
      run: |
        python -c "import jax; print(f'JAX: {jax.__version__}')"
        python -c "import qutip; print(f'QuTiP: {qutip.__version__}')"
        python -c "import numpy; print(f'NumPy: {numpy.__version__}')"
        python -c "import optax; print(f'Optax: {optax.__version__}')"
        python -c "import qsopt; print('qsopt import OK')"

    - name: Run all tests
      run: pytest src/qsopt/tests/ -v --tb=short

  coverage:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: coverage-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

    - name: Install package with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run all tests with coverage
      run: |
        pytest src/qsopt/tests/ \
          --cov=src/qsopt \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-report=html \
          -q

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14
