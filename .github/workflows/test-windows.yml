name: Quick Windows Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display Python version
      run: python --version
    
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    
    - name: Install package with test dependencies
      run: |
        pip install -e ".[test]"
    
    - name: Verify installation
      run: |
        python -c "import qsopt; print(f'qsopt version: {qsopt.__version__}')"
        python -c "import jax; print(f'JAX version: {jax.__version__}')"
        python -c "import qutip; print(f'QuTiP version: {qutip.__version__}')"
    
    - name: Run installation tests
      run: |
        pytest src/qsopt/tests/test_installation.py -v -k "not TestFreshEnvironmentInstallation" --tb=short
    
    - name: Run gate tests
      run: |
        pytest src/qsopt/tests/test_gates.py -v --tb=short
    
    - name: Run circuit tests
      run: |
        pytest src/qsopt/tests/test_circuit.py -v --tb=short
    
    - name: Run all other tests
      run: |
        pytest src/qsopt/tests/ -v --ignore=src/qsopt/tests/test_installation.py --ignore=src/qsopt/tests/test_gates.py --ignore=src/qsopt/tests/test_circuit.py --tb=short
      continue-on-error: true
    
    - name: Generate test coverage report
      if: always()
      run: |
        pip install pytest-cov
        pytest src/qsopt/tests/test_installation.py src/qsopt/tests/test_gates.py src/qsopt/tests/test_circuit.py --cov=src/qsopt --cov-report=term --cov-report=html -k "not TestFreshEnvironmentInstallation"
      continue-on-error: true
    
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-windows-py${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7
      continue-on-error: true

  test-installation-fresh-env:
    runs-on: windows-latest
    needs: test-windows
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Test installation in fresh environment
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pytest src/qsopt/tests/test_installation.py::TestFreshEnvironmentInstallation -v --tb=short
      continue-on-error: true
